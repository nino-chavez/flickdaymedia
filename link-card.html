<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Flickday Link Hub</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #000;
      font-family: sans-serif;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .link-card {
      position: relative;
      width: 100%;
      max-width: 480px;
    }

    .link-card img {
      width: 100%;
      height: auto;
      display: block;
      object-fit: contain;
    }

    .link-card a {
      position: absolute;
      display: block;
      left: 8%;
      width: 84%;
      height: 52px;
      opacity: 1;
      cursor: pointer;
      /* TEMP VISUALIZATION: 20% opaque overlays */
      background-color: rgba(255, 255, 0, 0.2); /* yellow tint for visibility */
      border: 1px dashed rgba(255, 255, 255, 0.3);
    }

    /* Button positions */
    .btn-photo     { top: 13.5%; }
    .btn-pepper    { top: 25.2%; }
    .btn-blog      { top: 36.9%; }
    .btn-flickday  { top: 48.7%; }
    .btn-contact   { top: 60.4%; }

    @media (max-width: 600px) {
      .link-card a {
        height: 48px;
      }
    }
  </style>
</head>
<body>
  <div class="link-card">
    <img src="https://flickdaymedia.com/flickday-assets/link-card-v2.png" alt="Flickday Link Card" />

    <a class="btn-photo"     href="https://www.nino.photos"       target="_blank" title="My Photo Work"></a>
    <a class="btn-pepper"    href="https://letspepper.com"        target="_blank" title="Let's Pepper Open"></a>
    <a class="btn-blog"      href="https://blog.nino.photos"      target="_blank" title="Signal Reflex Blog"></a>
    <a class="btn-flickday"  href="https://flickdaymedia.com"     target="_blank" title="Flickday Media"></a>
    <a class="btn-contact"   href="mailto:hello@nino.photos"                      title="Get in Touch"></a>
  </div>
</body>
</html>
