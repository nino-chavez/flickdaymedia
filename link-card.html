<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Flickday Link Hub</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background-color: #000;
      color: #fff;
      font-family: sans-serif;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .link-card {
      position: relative;
      width: 100%;
      max-width: 500px;
    }
    .link-card img {
      width: 100%;
      height: auto;
      display: block;
      object-fit: contain;
    }
    .link-card a {
      position: absolute;
      display: block;
      width: 70%;
      height: 40px;
      left: 15%;
      opacity: 0;
      cursor: pointer;
    }

    /* Adjust these top values to line up buttons with your background image */

    .btn-1 { top: 28%; } /* www.nino.photos */
    .btn-2 { top: 39%; } /* blog.nino.photos */
    .btn-3 { top: 50%; } /* flickdaymedia.com */
    .btn-4 { top: 61%; } /* mailto */

    @media screen and (max-width: 600px) {
      .link-card a {
        height: 36px;
      }
    }
  </style>
</head>
<body>
  <div class="link-card">
    <img src="/flickday-assets/link-card-v2.png" alt="Flickday Link Hub Background">

    <a class="btn-1" href="https://www.nino.photos" target="_blank" title="Photo Site"></a>
    <a class="btn-2" href="https://blog.nino.photos" target="_blank" title="Signal Reflex Blog"></a>
    <a class="btn-3" href="https://flickdaymedia.com" target="_blank" title="Flickday Media"></a>
    <a class="btn-4" href="mailto:nino@nino.photos" title="Email Nino"></a>
  </div>
</body>
</html>
