<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Links | Nino Chavez</title>
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Open+Sans&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      font-family: 'Open Sans', sans-serif;
      background-color: #000;
      color: #2d545e;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem;
      min-height: 100vh;
      position: relative;
    }

    h1 {
      font-family: 'Bangers', cursive;
      font-size: 3rem;
      text-shadow: 2px 2px #f7c331;
      color: #12343b;
      margin-bottom: 0.5rem;
    }

    .handle {
      color: #fefefe;
      font-size: 1rem;
      font-weight: bold;
      margin-bottom: 2rem;
      text-shadow: 1px 1px #000;
    }

    .handle a {
      color: #f7c331;
      text-decoration: none;
      margin: 0 0.25rem;
    }

    .link-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1rem;
      max-width: 428px;
      width: 100%;
    }

    .card {
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: 1rem;
      overflow: hidden;
      box-shadow: 0 0 12px rgba(0, 0, 0, 0.5);
      transition: transform 0.2s ease-in-out;
    }

    .card:hover {
      transform: scale(1.05);
    }

    .card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
  </style>
</head>
<body>
  <h1>Let’s Go!</h1>
  <div class="handle">
    <a href="https://instagram.com/nino.chavez.photo" target="_blank">@nino.chavez.photo</a> |
    <a href="https://www.instagram.com/letspepper.open" target="_blank">@letspepper</a> |
    <a href="https://www.instagram.com/flickday.media" target="_blank">@flickdaymedia</a>
  </div>

  <div class="link-grid">
    <a class="card" href="https://nino.photos" target="_blank">
      <img src="/link-cards/photo-work.png" alt="My Photo Work">
    </a>
    <a class="card" href="https://letspepper.com" target="_blank">
      <img src="/link-cards/lets-pepper.png" alt="Let’s Pepper Open">
    </a>
    <a class="card" href="https://blog.nino.photos" target="_blank">
      <img src="/link-cards/blog.png" alt="Signal Reflex Blog">
    </a>
    <a class="card" href="https://flickdaymedia.com" target="_blank">
      <img src="/link-cards/flickday.png" alt="Flickday Media">
    </a>
    <a class="card" href="https://nino.photos/pepper-launch" target="_blank">
      <img src="/link-cards/gallery.png" alt="Latest Gallery">
    </a>
    <a class="card" href="mailto:hello@nino.photos" target="_blank">
      <img src="/link-cards/contact.png" alt="Get in Touch">
    </a>
  </div>
</body>
</html>
