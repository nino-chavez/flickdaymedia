<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Links | Nino Chavez</title>
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Open+Sans&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      font-family: 'Open Sans', sans-serif;
      background-color: #000;
      color: #2d545e;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1rem;
      min-height: 100vh;
    }

    h1 {
      font-family: 'Bangers', cursive;
      font-size: 2.5rem;
      text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.7), 2px 2px #f7c331;
      color: #fefefe;
      margin-bottom: 0.5rem;
    }

    .handle {
      color: #fefefe;
      font-size: 0.9rem;
      font-weight: bold;
      margin-bottom: 1rem;
      text-shadow: 1px 1px #000;
    }

    .handle a {
      color: #f7c331;
      text-decoration: none;
      margin: 0 0.25rem;
    }

    .bg-container {
      position: relative;
      width: 100%;
      max-width: 428px;
      aspect-ratio: 3 / 4;
      background: url('https://flickdaymedia.com/flickday-assets/link-card-v2.png') center/cover no-repeat;
    }

    .hotspot {
      position: absolute;
      width: 90%;
      height: 10.5%;
      left: 5%;
      cursor: pointer;
    }

    .photo-work { top: 15.8%; }
    .lets-pepper { top: 29.2%; }
    .blog { top: 43%; }
    .flickday { top: 56.7%; }
    .contact { top: 70.2%; height: 11.2%; }
  </style>
</head>
<body>
  <h1>Let’s Go!</h1>
  <div class="handle">
    <a href="https://instagram.com/nino.chavez.photo" target="_blank">@nino.chavez.photo</a> |
    <a href="https://www.instagram.com/letspepper.open" target="_blank">@letspepper</a>
  </div>

  <div class="bg-container">
    <a class="hotspot photo-work" href="https://nino.photos" target="_blank"></a>
    <a class="hotspot lets-pepper" href="https://letspepper.com" target="_blank"></a>
    <a class="hotspot blog" href="https://blog.nino.photos" target="_blank"></a>
    <a class="hotspot flickday" href="https://flickdaymedia.com" target="_blank"></a>
    <a class="hotspot contact" href="mailto:hello@nino.photos"></a>
  </div>
</body>
</html>
