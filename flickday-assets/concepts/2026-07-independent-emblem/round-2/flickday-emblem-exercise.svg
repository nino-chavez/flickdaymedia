<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1240" viewBox="0 0 1800 1240" role="img" aria-labelledby="title desc">
  <title id="title">Flickday emblem design exercise</title>
  <desc id="desc">Six vector-native emblem directions exploring motion, capture, sequencing, framing, and the Flickday initial.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000000" flood-opacity="0.24"/>
    </filter>
    <path id="f" d="M 85.199219 -119.601562 C 84 -120.132812 82.601562 -120.566406 81 -120.898438 C 79.398438 -121.234375 77.800781 -121.398438 76.199219 -121.398438 C 71.667969 -121.398438 68.5 -120 66.699219 -117.199219 C 64.898438 -114.398438 64 -110.867188 64 -106.601562 L 64 -105.199219 L 86.199219 -105.199219 L 86.199219 -72.199219 L 64 -72.199219 L 64 0 L 18 0 L 18 -72.199219 L 0 -72.199219 L 0 -105.199219 L 18 -105.199219 L 18 -107.601562 C 18 -114.132812 18.765625 -120.398438 20.300781 -126.398438 C 21.832031 -132.398438 24.464844 -137.699219 28.199219 -142.300781 C 31.933594 -146.898438 36.964844 -150.535156 43.300781 -153.199219 C 49.632812 -155.867188 57.601562 -157.199219 67.199219 -157.199219 C 70.265625 -157.199219 73.832031 -156.964844 77.898438 -156.5 C 81.964844 -156.035156 85.398438 -155.265625 88.199219 -154.199219 Z"/>
    <path id="d" d="M 6.398438 -53 C 6.398438 -59.800781 7.433594 -66.464844 9.5 -73 C 11.566406 -79.535156 14.601562 -85.398438 18.601562 -90.601562 C 22.601562 -95.800781 27.601562 -100 33.601562 -103.199219 C 39.601562 -106.398438 46.535156 -108 54.398438 -108 C 59.464844 -108 64.535156 -107.035156 69.601562 -105.101562 C 74.667969 -103.167969 78.734375 -100.398438 81.800781 -96.800781 L 82.199219 -96.800781 L 82.199219 -151.199219 L 128.199219 -151.199219 L 128.199219 0 L 86.800781 0 L 86.800781 -11 L 86.398438 -11 C 83.332031 -6.734375 78.867188 -3.367188 73 -0.898438 C 67.132812 1.566406 60.933594 2.800781 54.398438 2.800781 C 46.53125 2.800781 39.601562 1.199219 33.601562 -2 C 27.601562 -5.199219 22.601562 -9.433594 18.601562 -14.699219 C 14.601562 -19.964844 11.566406 -25.933594 9.5 -32.601562 C 7.433594 -39.265625 6.398438 -46.066406 6.398438 -53 Z M 49.199219 -53 C 49.199219 -47.933594 50.667969 -43.699219 53.601562 -40.300781 C 56.535156 -36.898438 60.800781 -35.199219 66.398438 -35.199219 C 71.867188 -35.199219 76.234375 -36.933594 79.5 -40.398438 C 82.765625 -43.867188 84.398438 -48.066406 84.398438 -53 C 84.398438 -57.667969 82.765625 -61.734375 79.5 -65.199219 C 76.234375 -68.667969 71.867188 -70.398438 66.398438 -70.398438 C 60.800781 -70.398438 56.535156 -68.667969 53.601562 -65.199219 C 50.667969 -61.734375 49.199219 -57.667969 49.199219 -53 Z"/>
    <clipPath id="f-top"><rect x="-10" y="-170" width="120" height="66"/></clipPath>
    <clipPath id="f-base"><rect x="-10" y="-104" width="120" height="120"/></clipPath>
  </defs>

  <rect width="1800" height="1240" fill="#0F1115"/>
  <circle cx="1660" cy="92" r="210" fill="#FACC15" opacity="0.035"/>
  <circle cx="120" cy="1170" r="270" fill="#FACC15" opacity="0.025"/>

  <text x="70" y="84" fill="#FACC15" font-family="Inter, Arial, sans-serif" font-weight="800" font-size="20" letter-spacing="5">FLICKDAY / EMBLEM TERRITORIES</text>
  <text x="70" y="143" fill="#F7F4ED" font-family="Inter, Arial, sans-serif" font-weight="800" font-size="48">Six ways to make “capture in motion” ownable.</text>
  <text x="70" y="183" fill="#9CA3AF" font-family="Inter, Arial, sans-serif" font-size="21">Vector studies, not final logos · no reel · no filmstrip · no multi-icon wordmark</text>

  <!-- card 1 -->
  <g transform="translate(70 235)" filter="url(#shadow)">
    <rect width="520" height="420" rx="30" fill="#171A20" stroke="#2B303A"/>
    <rect x="28" y="28" width="62" height="30" rx="15" fill="#FACC15"/>
    <text x="59" y="49" text-anchor="middle" fill="#111318" font-family="Inter, Arial" font-size="14" font-weight="900">01</text>
    <g transform="translate(205 254) scale(1.12)">
      <use href="#f" fill="#FACC15" clip-path="url(#f-base)"/>
      <use href="#f" fill="#FACC15" clip-path="url(#f-top)" transform="translate(12 -4)"/>
      <path d="M 91 -164 L 115 -168" stroke="#FACC15" stroke-width="5" stroke-linecap="round" opacity="0.45"/>
    </g>
    <text x="28" y="330" fill="#F7F4ED" font-family="Inter, Arial" font-size="26" font-weight="800">Flicked cap</text>
    <text x="28" y="363" fill="#A6ADB8" font-family="Inter, Arial" font-size="17">The top of the actual f moves instead of being cut.</text>
    <text x="28" y="392" fill="#69717E" font-family="Inter, Arial" font-size="15">Signal: flick / motion · Risk: detached piece</text>
  </g>

  <!-- card 2 -->
  <g transform="translate(640 235)" filter="url(#shadow)">
    <rect width="520" height="420" rx="30" fill="#171A20" stroke="#2B303A"/>
    <rect x="28" y="28" width="62" height="30" rx="15" fill="#FACC15"/>
    <text x="59" y="49" text-anchor="middle" fill="#111318" font-family="Inter, Arial" font-size="14" font-weight="900">02</text>
    <g transform="translate(208 255) scale(1.12)">
      <use href="#f" fill="none" stroke="#FACC15" stroke-width="6" opacity="0.18" clip-path="url(#f-top)" transform="translate(22 -8)"/>
      <use href="#f" fill="none" stroke="#FACC15" stroke-width="5" opacity="0.38" clip-path="url(#f-top)" transform="translate(11 -4)"/>
      <use href="#f" fill="#F7F4ED"/>
    </g>
    <text x="28" y="330" fill="#F7F4ED" font-family="Inter, Arial" font-size="26" font-weight="800">Frame echo</text>
    <text x="28" y="363" fill="#A6ADB8" font-family="Inter, Arial" font-size="17">A short exposure trail turns the f into a sequence.</text>
    <text x="28" y="392" fill="#69717E" font-family="Inter, Arial" font-size="15">Signal: frames / speed · Risk: effect, not emblem</text>
  </g>

  <!-- card 3 -->
  <g transform="translate(1210 235)" filter="url(#shadow)">
    <rect width="520" height="420" rx="30" fill="#171A20" stroke="#2B303A"/>
    <rect x="28" y="28" width="62" height="30" rx="15" fill="#FACC15"/>
    <text x="59" y="49" text-anchor="middle" fill="#111318" font-family="Inter, Arial" font-size="14" font-weight="900">03</text>
    <g transform="translate(168 86)">
      <path d="M 18 172 V 42 Q 18 18 42 18 H 146" fill="none" stroke="#F7F4ED" stroke-width="18" stroke-linecap="round"/>
      <path d="M 182 76 V 148 Q 182 172 158 172 H 52" fill="none" stroke="#F7F4ED" stroke-width="18" stroke-linecap="round"/>
      <circle cx="177" cy="25" r="24" fill="#FACC15"/>
      <path d="M 132 25 H 92 M 145 48 H 119" stroke="#FACC15" stroke-width="8" stroke-linecap="round" opacity="0.55"/>
    </g>
    <text x="28" y="330" fill="#F7F4ED" font-family="Inter, Arial" font-size="26" font-weight="800">Live frame</text>
    <text x="28" y="363" fill="#A6ADB8" font-family="Inter, Arial" font-size="17">A captured moment escapes the edge of the frame.</text>
    <text x="28" y="392" fill="#69717E" font-family="Inter, Arial" font-size="15">Signal: capture / energy · Risk: app-icon familiar</text>
  </g>

  <!-- card 4 -->
  <g transform="translate(70 700)" filter="url(#shadow)">
    <rect width="520" height="420" rx="30" fill="#171A20" stroke="#2B303A"/>
    <rect x="28" y="28" width="62" height="30" rx="15" fill="#FACC15"/>
    <text x="59" y="49" text-anchor="middle" fill="#111318" font-family="Inter, Arial" font-size="14" font-weight="900">04</text>
    <g transform="translate(152 84)">
      <path d="M 20 154 C 72 154 78 55 164 55" fill="none" stroke="#F7F4ED" stroke-width="19" stroke-linecap="round"/>
      <circle cx="178" cy="55" r="31" fill="#FACC15"/>
      <path d="M 174 15 L 184 0 M 211 29 L 228 17" stroke="#FACC15" stroke-width="8" stroke-linecap="round" opacity="0.58"/>
    </g>
    <text x="28" y="330" fill="#F7F4ED" font-family="Inter, Arial" font-size="26" font-weight="800">Flick gesture</text>
    <text x="28" y="363" fill="#A6ADB8" font-family="Inter, Arial" font-size="17">A moment travels through a deliberate upward gesture.</text>
    <text x="28" y="392" fill="#69717E" font-family="Inter, Arial" font-size="15">Signal: action / lift · Risk: sports-tech adjacent</text>
  </g>

  <!-- card 5 -->
  <g transform="translate(640 700)" filter="url(#shadow)">
    <rect width="520" height="420" rx="30" fill="#171A20" stroke="#2B303A"/>
    <rect x="28" y="28" width="62" height="30" rx="15" fill="#FACC15"/>
    <text x="59" y="49" text-anchor="middle" fill="#111318" font-family="Inter, Arial" font-size="14" font-weight="900">05</text>
    <g transform="translate(165 83)" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 65 18 H 18 V 65 M 142 18 H 188 V 55 M 188 143 V 188 H 143 M 65 188 H 18 V 143" stroke="#F7F4ED" stroke-width="17"/>
      <circle cx="103" cy="103" r="42" fill="#FACC15" stroke="none"/>
      <path d="M 172 75 L 197 64" stroke="#FACC15" stroke-width="9"/>
    </g>
    <text x="28" y="330" fill="#F7F4ED" font-family="Inter, Arial" font-size="26" font-weight="800">Moment field</text>
    <text x="28" y="363" fill="#A6ADB8" font-family="Inter, Arial" font-size="17">Framing stays open while the subject remains central.</text>
    <text x="28" y="392" fill="#69717E" font-family="Inter, Arial" font-size="15">Signal: focus / subject · Risk: camera-UI generic</text>
  </g>

  <!-- card 6 -->
  <g transform="translate(1210 700)" filter="url(#shadow)">
    <rect width="520" height="420" rx="30" fill="#171A20" stroke="#2B303A"/>
    <rect x="28" y="28" width="62" height="30" rx="15" fill="#FACC15"/>
    <text x="59" y="49" text-anchor="middle" fill="#111318" font-family="Inter, Arial" font-size="14" font-weight="900">06</text>
    <g transform="translate(160 265) scale(1.08)">
      <use href="#d" fill="#FACC15" transform="translate(55 0)"/>
      <use href="#f" fill="#F7F4ED"/>
    </g>
    <text x="28" y="330" fill="#F7F4ED" font-family="Inter, Arial" font-size="26" font-weight="800">FD overlap</text>
    <text x="28" y="363" fill="#A6ADB8" font-family="Inter, Arial" font-size="17">The real brand letters become a compact monogram.</text>
    <text x="28" y="392" fill="#69717E" font-family="Inter, Arial" font-size="15">Signal: ownership / name · Risk: density and reading</text>
  </g>

  <text x="70" y="1192" fill="#6F7783" font-family="Inter, Arial" font-size="17">Evaluation criteria: recognizable at 32 px · works in one color · animates with purpose · does not require a film-history explanation</text>
</svg>
