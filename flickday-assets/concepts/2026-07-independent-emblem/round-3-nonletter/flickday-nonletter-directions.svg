<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1240" viewBox="0 0 1800 1240" role="img" aria-labelledby="title desc">
  <title id="title">Flickday non-letter identity directions</title>
  <desc id="desc">Six fresh abstract brand marks without initials, cameras, reels, filmstrips, or play buttons.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000" flood-opacity="0.26"/>
    </filter>
    <clipPath id="topHalf"><rect x="0" y="0" width="220" height="105"/></clipPath>
    <clipPath id="bottomHalf"><rect x="0" y="105" width="220" height="115"/></clipPath>
  </defs>

  <rect width="1800" height="1240" fill="#0F1115"/>
  <path d="M 1480 0 H 1800 V 290 C 1670 275 1560 195 1480 0 Z" fill="#FACC15" opacity="0.035"/>
  <path d="M 0 990 C 140 950 290 1015 390 1240 H 0 Z" fill="#FACC15" opacity="0.028"/>

  <text x="70" y="84" fill="#FACC15" font-family="Inter, Arial, sans-serif" font-weight="800" font-size="20" letter-spacing="5">FLICKDAY / FRESH TERRITORIES</text>
  <text x="70" y="143" fill="#F7F4ED" font-family="Inter, Arial, sans-serif" font-weight="800" font-size="48">No initials. No camera clichés. No film nostalgia.</text>
  <text x="70" y="183" fill="#9CA3AF" font-family="Inter, Arial, sans-serif" font-size="21">Abstract signals designed to move, crop, stamp, repeat, and live beside the wordmark</text>

  <!-- 01 Scene Shift -->
  <g transform="translate(70 235)" filter="url(#shadow)">
    <rect width="520" height="420" rx="30" fill="#171A20" stroke="#2B303A"/>
    <rect x="28" y="28" width="62" height="30" rx="15" fill="#FACC15"/>
    <text x="59" y="49" text-anchor="middle" fill="#111318" font-family="Inter, Arial" font-size="14" font-weight="900">01</text>
    <g transform="translate(155 82)">
      <path d="M 20 18 H 99 L 79 198 H 0 Z" fill="#F7F4ED"/>
      <path d="M 127 2 H 206 L 226 182 H 147 Z" fill="#FACC15"/>
      <path d="M 102 37 L 124 17" stroke="#FACC15" stroke-width="9" stroke-linecap="round" opacity="0.45"/>
    </g>
    <text x="28" y="330" fill="#F7F4ED" font-family="Inter, Arial" font-size="26" font-weight="800">Scene shift</text>
    <text x="28" y="363" fill="#A6ADB8" font-family="Inter, Arial" font-size="17">Two visual states pass each other between frames.</text>
    <text x="28" y="392" fill="#69717E" font-family="Inter, Arial" font-size="15">Strength: editing / motion · Risk: pause-button echo</text>
  </g>

  <!-- 02 Flashcut -->
  <g transform="translate(640 235)" filter="url(#shadow)">
    <rect width="520" height="420" rx="30" fill="#171A20" stroke="#2B303A"/>
    <rect x="28" y="28" width="62" height="30" rx="15" fill="#FACC15"/>
    <text x="59" y="49" text-anchor="middle" fill="#111318" font-family="Inter, Arial" font-size="14" font-weight="900">02</text>
    <g transform="translate(260 178)">
      <path d="M -20 -18 L -92 -50 Q -107 -57 -99 -72 L -84 -98 Q -76 -112 -62 -101 L -3 -56 Z" fill="#F7F4ED"/>
      <path d="M 18 -20 L 47 -94 Q 53 -110 69 -103 L 95 -91 Q 110 -84 100 -69 L 55 -5 Z" fill="#FACC15"/>
      <path d="M 20 18 L 91 47 Q 107 53 100 69 L 88 95 Q 81 110 66 100 L 3 55 Z" fill="#F7F4ED"/>
      <path d="M -18 20 L -47 92 Q -53 108 -69 101 L -95 89 Q -110 82 -100 67 L -55 3 Z" fill="#FACC15"/>
      <rect x="-17" y="-17" width="34" height="34" rx="8" fill="#171A20" transform="rotate(12)"/>
    </g>
    <text x="28" y="330" fill="#F7F4ED" font-family="Inter, Arial" font-size="26" font-weight="800">Flashcut</text>
    <text x="28" y="363" fill="#A6ADB8" font-family="Inter, Arial" font-size="17">An asymmetric burst built from four interrupted beats.</text>
    <text x="28" y="392" fill="#69717E" font-family="Inter, Arial" font-size="15">Strength: energy / capture · Risk: sparkle category</text>
  </g>

  <!-- 03 Dayline -->
  <g transform="translate(1210 235)" filter="url(#shadow)">
    <rect width="520" height="420" rx="30" fill="#171A20" stroke="#2B303A"/>
    <rect x="28" y="28" width="62" height="30" rx="15" fill="#FACC15"/>
    <text x="59" y="49" text-anchor="middle" fill="#111318" font-family="Inter, Arial" font-size="14" font-weight="900">03</text>
    <g transform="translate(150 72)">
      <circle cx="110" cy="110" r="92" fill="#FACC15" clip-path="url(#topHalf)"/>
      <circle cx="110" cy="110" r="92" fill="#F7F4ED" clip-path="url(#bottomHalf)" transform="translate(14 0)"/>
      <path d="M 4 109 H 216" stroke="#171A20" stroke-width="17"/>
      <path d="M 198 87 L 220 76" stroke="#FACC15" stroke-width="8" stroke-linecap="round" opacity="0.52"/>
    </g>
    <text x="28" y="330" fill="#F7F4ED" font-family="Inter, Arial" font-size="26" font-weight="800">Dayline</text>
    <text x="28" y="363" fill="#A6ADB8" font-family="Inter, Arial" font-size="17">Light and time split into two slightly different moments.</text>
    <text x="28" y="392" fill="#69717E" font-family="Inter, Arial" font-size="15">Strength: name / light · Risk: sunset or wellness</text>
  </g>

  <!-- 04 Moment Signal -->
  <g transform="translate(70 700)" filter="url(#shadow)">
    <rect width="520" height="420" rx="30" fill="#171A20" stroke="#2B303A"/>
    <rect x="28" y="28" width="62" height="30" rx="15" fill="#FACC15"/>
    <text x="59" y="49" text-anchor="middle" fill="#111318" font-family="Inter, Arial" font-size="14" font-weight="900">04</text>
    <g transform="translate(115 92)">
      <path d="M 12 100 C 54 48 80 35 119 31" fill="none" stroke="#F7F4ED" stroke-width="20" stroke-linecap="round"/>
      <path d="M 278 100 C 236 152 210 165 171 169" fill="none" stroke="#F7F4ED" stroke-width="20" stroke-linecap="round"/>
      <circle cx="145" cy="100" r="47" fill="#FACC15"/>
      <path d="M 124 100 H 166" stroke="#171A20" stroke-width="12" stroke-linecap="round"/>
    </g>
    <text x="28" y="330" fill="#F7F4ED" font-family="Inter, Arial" font-size="26" font-weight="800">Moment signal</text>
    <text x="28" y="363" fill="#A6ADB8" font-family="Inter, Arial" font-size="17">Energy converges on one selected moment, then releases.</text>
    <text x="28" y="392" fill="#69717E" font-family="Inter, Arial" font-size="15">Strength: focus / flow · Risk: abstract at first glance</text>
  </g>

  <!-- 05 Cut Stack -->
  <g transform="translate(640 700)" filter="url(#shadow)">
    <rect width="520" height="420" rx="30" fill="#171A20" stroke="#2B303A"/>
    <rect x="28" y="28" width="62" height="30" rx="15" fill="#FACC15"/>
    <text x="59" y="49" text-anchor="middle" fill="#111318" font-family="Inter, Arial" font-size="14" font-weight="900">05</text>
    <g transform="translate(155 74)">
      <path d="M 0 25 H 52 V 101 L 0 111 Z M 0 129 L 52 119 V 205 H 0 Z" fill="#F7F4ED"/>
      <path d="M 86 8 H 138 V 84 L 86 94 Z M 86 112 L 138 102 V 188 H 86 Z" fill="#FACC15"/>
      <path d="M 172 42 H 224 V 118 L 172 128 Z M 172 146 L 224 136 V 222 H 172 Z" fill="#F7F4ED"/>
    </g>
    <text x="28" y="330" fill="#F7F4ED" font-family="Inter, Arial" font-size="26" font-weight="800">Cut stack</text>
    <text x="28" y="363" fill="#A6ADB8" font-family="Inter, Arial" font-size="17">Three beats share one editorial cut and stagger in time.</text>
    <text x="28" y="392" fill="#69717E" font-family="Inter, Arial" font-size="15">Strength: rhythm / system · Risk: audio or analytics</text>
  </g>

  <!-- 06 Corner Hit -->
  <g transform="translate(1210 700)" filter="url(#shadow)">
    <rect width="520" height="420" rx="30" fill="#171A20" stroke="#2B303A"/>
    <rect x="28" y="28" width="62" height="30" rx="15" fill="#FACC15"/>
    <text x="59" y="49" text-anchor="middle" fill="#111318" font-family="Inter, Arial" font-size="14" font-weight="900">06</text>
    <g transform="translate(160 82)">
      <path d="M 18 78 V 18 H 78" fill="none" stroke="#F7F4ED" stroke-width="19" stroke-linecap="round"/>
      <path d="M 182 122 V 182 H 122" fill="none" stroke="#F7F4ED" stroke-width="19" stroke-linecap="round"/>
      <rect x="90" y="39" width="70" height="70" rx="16" fill="#FACC15" transform="rotate(9 125 74)"/>
      <rect x="47" y="91" width="70" height="70" rx="16" fill="#F7F4ED" transform="rotate(-6 82 126)"/>
    </g>
    <text x="28" y="330" fill="#F7F4ED" font-family="Inter, Arial" font-size="26" font-weight="800">Corner hit</text>
    <text x="28" y="363" fill="#A6ADB8" font-family="Inter, Arial" font-size="17">Two media tiles collide inside an intentionally open frame.</text>
    <text x="28" y="392" fill="#69717E" font-family="Inter, Arial" font-size="15">Strength: modular / social · Risk: layers-and-crop familiar</text>
  </g>

  <text x="70" y="1192" fill="#6F7783" font-family="Inter, Arial" font-size="17">A new emblem must work without the wordmark, but the broader identity can also choose a repeatable graphic device instead of forcing an icon.</text>
</svg>
