<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Flickday wordmark sting</title>
    <!-- Vendored locally: a CDN fetch would make the render non-deterministic. -->
    <script src="./assets/vendor/gsap.min.js"></script>
    <!-- The Peridot wordmark as eight registered letter layers, with each letter's
         ink centre. Generated by scripts/build-sting-wordmark.mjs; PNG because
         Peridot is licensed for live text, not outlines (BRAND-PRIORS.md). -->
    <script src="./assets/wordmark/layers.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      /* Alpha overlay: transparent everywhere. The compositor owns placement over footage. */
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
      #stage { position: relative; width: 100%; height: 100%; background: transparent; }

      /* Wordmark band: 800 px wide (74% of the frame), centred, inside the overlay
         kit's validated safe area (x 122-940). Its height and top come from the
         layers' aspect in the script below, optical centre at 46% of the frame. */
      #mark { position: absolute; left: 140px; width: 800px; }
      /* Legibility over bright footage: a FLAT offset shadow in dark ink, zero blur, never a
         glow (shot-plan build notes; added at nino's request, 2026-10-12). Per letter, not on
         the word: a filter applies before opacity, so each letter fades as one piece with its
         shadow. On the word, a half-faded letter showed its own shadow through it. At rest
         the two are the same, since each later letter paints over the shadow of the one
         before. 6 px: at phone size (about 0.36x) 4 px thinned to a hairline over white sky,
         and 10 px read as a 3D extrusion. */
      .letter { position: absolute; inset: 0; width: 100%; height: 100%; display: block;
                filter: drop-shadow(6px 6px 0 #111318); }
    </style>
  </head>
  <body>
    <div
      id="stage"
      data-composition-id="main"
      data-start="0"
      data-duration="5"
      data-fps="30"
      data-width="1080"
      data-height="1920"
    >
      <!-- Wordmark only. No play mark: it is never inside the d, and the symbol
           and lockup are still open (nino, 2026-10-12). -->
      <div id="mark" role="img" aria-label="flickday">
        <img class="letter" id="l1" src="assets/wordmark/letter-1.png" alt="" />
        <img class="letter" id="l2" src="assets/wordmark/letter-2.png" alt="" />
        <img class="letter" id="l3" src="assets/wordmark/letter-3.png" alt="" />
        <img class="letter" id="l4" src="assets/wordmark/letter-4.png" alt="" />
        <img class="letter" id="l5" src="assets/wordmark/letter-5.png" alt="" />
        <img class="letter" id="l6" src="assets/wordmark/letter-6.png" alt="" />
        <img class="letter" id="l7" src="assets/wordmark/letter-7.png" alt="" />
        <img class="letter" id="l8" src="assets/wordmark/letter-8.png" alt="" />
      </div>
    </div>

    <script>
      const WM = window.FLICKDAY_WORDMARK;
      const mark = document.getElementById("mark");
      const height = (800 * WM.height) / WM.width;
      mark.style.height = `${height}px`;
      mark.style.top = `${1920 * 0.46 - height / 2}px`;

      // Every layer shares the full mark's box, so scaling a letter about its own
      // ink centre grows and collapses it in place, and at scale 1 the stack is
      // exactly the locked mark.
      const letters = WM.letters.map((l, i) => {
        const node = document.getElementById(`l${i + 1}`);
        gsap.set(node, { transformOrigin: l.origin });
        return node;
      });

      // Frame 0 is fully clear for the overlay.
      gsap.set(letters, { autoAlpha: 0, scale: 0 });

      const tl = gsap.timeline({ paused: true });

      // --- Build (0.15-1.01s | f5-30) ---------------------------------------------------
      // Left to right, the way the word reads. Each letter grows about its own centre
      // and never past scale 1: Peridot is heavy and kerned tight, so any overshoot
      // fuses k|d and d|a for several frames. The snap lives on a small vertical lift
      // instead, which neighbours cannot collide on.
      letters.forEach((node, i) => {
        const at = 0.15 + i * 0.06;
        tl.fromTo(node, { scale: 0 }, { scale: 1, duration: 0.44, ease: "power3.out" }, at)
          .fromTo(node, { y: 36 }, { y: 0, duration: 0.44, ease: "back.out(2.2)" }, at)
          .fromTo(node, { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.3, ease: "power2.out" }, at);
      });

      // --- Hold (1.01-3.85s | f30-115) --------------------------------------------------
      // Flat and still: the frame editors composite over footage.

      // --- Retract (3.85-4.64s | f115-139) ----------------------------------------------
      // Same direction as the build, so the word clears the way it arrived.
      letters.forEach((node, i) => {
        const at = 3.85 + i * 0.05;
        tl.fromTo(node, { scale: 1 }, { scale: 0, duration: 0.44, ease: "power2.in", immediateRender: false }, at)
          .fromTo(node, { autoAlpha: 1 }, { autoAlpha: 0, duration: 0.44, ease: "power2.in", immediateRender: false }, at);
      });

      // --- Clear (4.64-5.00s | f139-150) ------------------------------------------------
      // Nothing on screen, so the last frame drops cleanly onto footage. The root
      // data-duration holds the length; the timeline's final empty state carries it.

      tl.seek(0);
      // Current runtimes create the registry first; the guard keeps older pins safe.
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
