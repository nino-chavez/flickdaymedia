<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Flickday wordmark sting</title>
    <!-- Vendored locally: a CDN fetch would make the render non-deterministic. -->
    <script src="./assets/vendor/gsap.min.js"></script>
    <!-- The Peridot wordmark as eight registered letter layers, with each letter's
         ink centre. Generated by scripts/build-sting-wordmark.mjs; PNG because
         Peridot is licensed for live text, not outlines (BRAND-PRIORS.md). -->
    <script src="./assets/wordmark/layers.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      /* Alpha overlay: transparent everywhere. The compositor owns placement over footage. */
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
      #stage { position: relative; width: 100%; height: 100%; background: transparent; }

      /* The tagline and MEDIA are live text in the site's own faces, vendored here so the
         render never waits on a CDN. Both are SIL OFL 1.1 (assets/vendor/fonts/README.md).
         The fallback is monospace on purpose: Impact looks enough like Anton that a failed
         load would pass a glance, and a monospace headline does not. */
      @font-face { font-family: "Anton"; src: url("assets/vendor/fonts/anton-latin.woff2") format("woff2");
                   font-weight: 400; font-style: normal; }
      @font-face { font-family: "JetBrains Mono"; src: url("assets/vendor/fonts/jetbrains-mono-latin.woff2") format("woff2");
                   font-weight: 500; font-style: normal; }

      /* The lockup the share card uses (nino, 2026-10-12): wordmark, MEDIA, then the tagline
         on two lines, at the card's proportions scaled to an 800 px mark. 800 px is 74% of
         the frame, inside the overlay kit's validated safe area (x 122-940). The column
         centres the whole group on the optical centre, 46% of the frame, so it sits clear
         of the bottom quarter, where Reels and TikTok draw their own buttons. */
      #lockup { position: absolute; left: 140px; top: 0; width: 800px; height: 1766px;
                display: flex; flex-direction: column; align-items: center; justify-content: center; }
      /* The wordmark band. Its height comes from the layers' aspect in the script below. */
      #mark { position: relative; flex: none; width: 800px; }
      /* Legibility over bright footage: a FLAT offset shadow in dark ink, zero blur, never a
         glow (shot-plan build notes; added at nino's request, 2026-10-12). Per letter, not on
         the word: a filter applies before opacity, so each letter fades as one piece with its
         shadow. On the word, a half-faded letter showed its own shadow through it. At rest
         the two are the same, since each later letter paints over the shadow of the one
         before. 6 px: at phone size (about 0.36x) 4 px thinned to a hairline over white sky,
         and 10 px read as a 3D extrusion. */
      .letter { position: absolute; inset: 0; width: 100%; height: 100%; display: block;
                filter: drop-shadow(6px 6px 0 #111318); }
      /* MEDIA: the site's label face, spaced 0.5em like the card. The left padding offsets
         the trailing letter-space so the word centres on its ink. 38 px, a little larger
         against the mark than the card's: at the card's 30 px it was about 11 px tall on a
         phone and blurred into a busy jersey. Its shadow is 3 px: 6 px doubled every stroke
         at this size. */
      #media { display: block; flex: none; margin-top: 18px; font-family: "JetBrains Mono", monospace;
               font-weight: 500; font-size: 38px; line-height: 1; letter-spacing: 0.5em; padding-left: 0.5em;
               text-transform: uppercase; color: #facc15; -webkit-text-stroke: 4px #111318; paint-order: stroke fill;
               filter: drop-shadow(3px 3px 0 #111318); }
      /* The tagline, exact, as the site's H1 sets it: Anton 400, uppercase, 0.01em,
         line-height 0.96, white. Two block lines, not a <br>, so each can move on its own.
         White has no hue to fall back on over white sky, so it also gets a dark outline,
         painted under the fill so the letters keep their weight: flat, like the shadow,
         never a glow. Without it, over a light frame only the shadow was left to read. */
      #tagline { display: block; flex: none; width: 800px; margin-top: 32px; }
      .tag-line { display: block; width: 800px; text-align: center; white-space: nowrap;
                  font-family: "Anton", monospace; font-weight: 400; font-size: 133px; line-height: 0.96;
                  letter-spacing: 0.01em; text-transform: uppercase; color: #ffffff;
                  -webkit-text-stroke: 6px #111318; paint-order: stroke fill;
                  filter: drop-shadow(6px 6px 0 #111318); }
    </style>
  </head>
  <body>
    <div
      id="stage"
      data-composition-id="main"
      data-start="0"
      data-duration="5"
      data-fps="30"
      data-width="1080"
      data-height="1920"
    >
      <!-- No play mark: it is never inside the d, and the symbol and the symbol-with-
           wordmark lockup are still open (nino, 2026-10-12). -->
      <div id="lockup">
      <div id="mark" role="img" aria-label="flickday">
        <img class="letter" id="l1" src="assets/wordmark/letter-1.png" alt="" />
        <img class="letter" id="l2" src="assets/wordmark/letter-2.png" alt="" />
        <img class="letter" id="l3" src="assets/wordmark/letter-3.png" alt="" />
        <img class="letter" id="l4" src="assets/wordmark/letter-4.png" alt="" />
        <img class="letter" id="l5" src="assets/wordmark/letter-5.png" alt="" />
        <img class="letter" id="l6" src="assets/wordmark/letter-6.png" alt="" />
        <img class="letter" id="l7" src="assets/wordmark/letter-7.png" alt="" />
        <img class="letter" id="l8" src="assets/wordmark/letter-8.png" alt="" />
      </div>
      <div id="media">Media</div>
      <div id="tagline">
        <div class="tag-line" id="tag-1">Every Day's a</div>
        <div class="tag-line" id="tag-2">Flickday.</div>
      </div>
      </div>
    </div>

    <script>
      const WM = window.FLICKDAY_WORDMARK;
      const mark = document.getElementById("mark");
      mark.style.height = `${(800 * WM.height) / WM.width}px`;

      // Every layer shares the full mark's box, so scaling a letter about its own
      // ink centre grows and collapses it in place, and at scale 1 the stack is
      // exactly the locked mark.
      const letters = WM.letters.map((l, i) => {
        const node = document.getElementById(`l${i + 1}`);
        gsap.set(node, { transformOrigin: l.origin });
        return node;
      });

      const media = document.getElementById("media");
      const lines = [document.getElementById("tag-1"), document.getElementById("tag-2")];

      // Frame 0 is fully clear for the overlay.
      gsap.set(letters, { autoAlpha: 0, scale: 0 });
      gsap.set([media, ...lines], { autoAlpha: 0 });

      const tl = gsap.timeline({ paused: true });

      // --- Build (0.15-1.01s | f5-30) ---------------------------------------------------
      // Left to right, the way the word reads. Each letter grows about its own centre
      // and never past scale 1: Peridot is heavy and kerned tight, so any overshoot
      // fuses k|d and d|a for several frames. The snap lives on a small vertical lift
      // instead, which neighbours cannot collide on.
      letters.forEach((node, i) => {
        const at = 0.15 + i * 0.06;
        tl.fromTo(node, { scale: 0 }, { scale: 1, duration: 0.44, ease: "power3.out" }, at)
          .fromTo(node, { y: 36 }, { y: 0, duration: 0.44, ease: "back.out(2.2)" }, at)
          .fromTo(node, { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.3, ease: "power2.out" }, at);
      });

      // --- MEDIA and the tagline (0.86-1.70s | f26-51) --------------------------------
      // MEDIA settles under the word as its last letters land, then the tagline rises a
      // line at a time. A short lift and a fade, no scale: nothing here overshoots.
      tl.fromTo(media, { autoAlpha: 0, y: 14 }, { autoAlpha: 1, y: 0, duration: 0.36, ease: "power2.out" }, 0.86);
      lines.forEach((node, i) => {
        tl.fromTo(node, { autoAlpha: 0, y: 48 }, { autoAlpha: 1, y: 0, duration: 0.5, ease: "power3.out" }, 1.08 + i * 0.12);
      });

      // --- Hold (1.70-3.50s | f51-105) --------------------------------------------------
      // Flat and still: the frame editors composite over footage. The full lockup holds
      // for 1.8s, long enough to read the four words twice.

      // --- Tagline and MEDIA out (3.50-3.96s | f105-119) ---------------------------------
      // They leave first, top line first, so the word clears last, the way it arrived.
      lines.forEach((node, i) => {
        tl.fromTo(node, { autoAlpha: 1, y: 0 }, { autoAlpha: 0, y: -24, duration: 0.3, ease: "power2.in", immediateRender: false }, 3.5 + i * 0.06);
      });
      tl.fromTo(media, { autoAlpha: 1 }, { autoAlpha: 0, duration: 0.3, ease: "power2.in", immediateRender: false }, 3.66);

      // --- Retract (3.85-4.64s | f115-139) ----------------------------------------------
      // Same direction as the build, so the word clears the way it arrived.
      letters.forEach((node, i) => {
        const at = 3.85 + i * 0.05;
        tl.fromTo(node, { scale: 1 }, { scale: 0, duration: 0.44, ease: "power2.in", immediateRender: false }, at)
          .fromTo(node, { autoAlpha: 1 }, { autoAlpha: 0, duration: 0.44, ease: "power2.in", immediateRender: false }, at);
      });

      // --- Clear (4.64-5.00s | f139-150) ------------------------------------------------
      // Nothing on screen, so the last frame drops cleanly onto footage. The root
      // data-duration holds the length; the timeline's final empty state carries it.

      tl.seek(0);
      // Current runtimes create the registry first; the guard keeps older pins safe.
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
