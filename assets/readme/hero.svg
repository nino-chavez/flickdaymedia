<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440" role="img" aria-labelledby="t d">
  <title id="t">Flickday Media — Every Day's a Flickday</title>
  <desc id="d">Flickday Media: grassroots sports media, raw, fast and player-first. Chicago-based tournament coverage for volleyball and action sports. This repository is the flickdaymedia.com site — a static build plus the motion kit for overlays, wordmark stings, and film-room proof cards.</desc>

  <rect width="1200" height="440" fill="#000000"/>

  <!-- yellow rule stack, the site's own device -->
  <rect x="0" y="0" width="1200" height="8" fill="#facc15"/>

  <text x="64" y="86" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" letter-spacing="3" fill="#facc15">CHICAGO &#183; GRASSROOTS SPORTS MEDIA</text>

  <!-- wordmark: condensed, heavy, all caps -->
  <text x="61" y="196" font-family="Impact, 'Haettenschweiler', 'Arial Narrow Bold', -apple-system, sans-serif" font-size="112" letter-spacing="-1" fill="#ffffff">FLICKDAY</text>
  <text x="61" y="258" font-family="Impact, 'Haettenschweiler', 'Arial Narrow Bold', -apple-system, sans-serif" font-size="52" letter-spacing="14" fill="#facc15">MEDIA</text>

  <text x="64" y="316" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-style="italic" fill="#ffffff">&#8220;Every Day&#8217;s a Flickday&#8221;</text>
  <text x="64" y="352" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#888888">Raw, fast, player-first. We shoot for the ones who live in the rally.</text>

  <!-- what's in the repo -->
  <g transform="translate(760 96)">
    <text x="0" y="0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="2.2" fill="#888888">WHAT&#8217;S IN HERE</text>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" letter-spacing="1">
      <rect x="0" y="22" width="376" height="54" rx="4" fill="#111111" stroke="#333333"/>
      <text x="18" y="45" fill="#facc15">index.html</text>
      <text x="18" y="65" font-family="-apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="13" fill="#888888">the live site &#8212; and the brand&#8217;s ground truth</text>

      <rect x="0" y="88" width="376" height="54" rx="4" fill="#111111" stroke="#333333"/>
      <text x="18" y="111" fill="#facc15">motion/</text>
      <text x="18" y="131" font-family="-apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="13" fill="#888888">overlay kit, wordmark sting, film-room proof</text>

      <rect x="0" y="154" width="376" height="54" rx="4" fill="#111111" stroke="#333333"/>
      <text x="18" y="177" fill="#facc15">flickday-assets/</text>
      <text x="18" y="197" font-family="-apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="13" fill="#888888">wordmark studies and symbol explorations</text>

      <rect x="0" y="220" width="376" height="54" rx="4" fill="#111111" stroke="#333333"/>
      <text x="18" y="243" fill="#facc15">BRAND-PRIORS.md</text>
      <text x="18" y="263" font-family="-apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="13" fill="#888888">inputs for designing, not locked executions</text>
    </g>
  </g>

  <rect x="0" y="432" width="1200" height="8" fill="#facc15"/>
</svg>
