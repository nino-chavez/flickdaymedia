# Cloudflare Pages — flickdaymedia.com (git integration, no build step).
# Only site/ is published. Without pages_build_output_dir, Pages publishes the
# repo root, which served README.md, BRAND-PRIORS.md, scripts/ and the brand
# working files at flickdaymedia.com until 2026-10-09. Public files go in site/.
# Generated by `wrangler pages download config flickdaymedia`, then the output
# dir set; this file now overrides the dashboard's build settings.
name = "flickdaymedia"
pages_build_output_dir = "./site"
compatibility_date = "2026-05-06"
