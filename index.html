<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flickday Media</title>
    <link rel="icon" type="image/png" href="./flickday-assets/logo-monochrome-face.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', sans-serif;
      }
      .fade-in {
        opacity: 0;
        animation: fadeIn 1.5s ease-in-out forwards;
        animation-delay: 0.4s;
      }
      @keyframes fadeIn {
        to {
          opacity: 1;
        }
      }
      .glow:hover {
        filter: drop-shadow(0 0 8px #facc15);
        transition: filter 0.3s ease-in-out;
      }
    </style>
  </head>
  <body class="bg-black text-white">
    <div class="min-h-screen flex flex-col justify-between">
      <main class="flex-grow flex flex-col items-center justify-center text-center px-4 py-16">
        <h1 class="text-4xl md:text-5xl font-extrabold tracking-tight mt-4">Flickday Media</h1>
        <p>&nbsp;</p>

        <p class="text-sm text-yellow-400 uppercase tracking-wide fade-in">Every day’s a Flickday</p>
        <p class="mt-4 text-lg md:text-xl text-gray-300 max-w-xl">
          Grassroots sports media — raw, fast, and player-first. We shoot for the ones who live in the rally.
        </p>

        <div class="mt-10 grid gap-6 w-full max-w-3xl sm:grid-cols-3">
          <a href="https://www.instagram.com/flickday.media" target="_blank" rel="noopener noreferrer" class="bg-gray-900 border border-gray-700 rounded-xl p-6 hover:bg-gray-800 transition">
            <div class="text-3xl mb-2">🎥</div>
            <h3 class="font-semibold text-lg">Reels & Edits</h3>
          </a>
          <a href="https://www.nino.photos" target="_blank" rel="noopener noreferrer" class="bg-gray-900 border border-yellow-400 rounded-xl p-6 hover:bg-gray-800 transition">
            <img src="./flickday-assets/logo-monochrome-face.png" alt="Nino face icon" class="w-8 h-8 mx-auto mb-2">
            <h3 class="font-semibold text-lg">Photo Drops</h3>
          </a>
          <a href="https://letspepper.com" target="_blank" rel="noopener noreferrer" class="bg-gray-900 border border-gray-700 rounded-xl p-6 hover:bg-gray-800 transition">
            <div class="text-3xl mb-2">🏐</div>
            <h3 class="font-semibold text-lg">Let's Pepper Open</h3>
          </a>
        </div>
<p>&nbsp;</p>
        <img src="./flickday-assets/flickday-badge.png" alt="Flickday Media badge logo" class="w-40 mb-4 glow">
      </main>

      <footer class="text-center py-6 text-sm text-gray-500">
        © 2025 Flickday Media. Built with sweat and Tailwind.
      </footer>
    </div>
  </body>
</html>
